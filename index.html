document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3D56;\n--color-secondary:#13AFF0;\n--color-accent:#1C75BC;\n\n/* Navy ramp (dark sections) */\n--navy-900:#060f1e;\n--navy-850:#061420;\n--navy-800:#0D2B3E;\n--navy-700:#0f2133;\n--navy-600:#153D56;\n\n/* Cyan */\n--cyan-500:#13AFF0;\n--cyan-600:#0d9fd8;\n--cyan-tint-15:rgba(19,175,240,0.15);\n--cyan-tint-10:rgba(19,175,240,0.10);\n--cyan-tint-20:rgba(19,175,240,0.20);\n\n/* Neutrals */\n--white:#ffffff;\n--neutral-100:#f5f5f5;\n--surface-muted:#f8f9fa;\n--border:#e2e8f0;\n--border-neutral:#e5e5e5;\n\n/* Text */\n--text-body:#1a1a1a;\n--text-muted:#334155;\n--text-subtle:#475569;\n--text-faint:#94a3b8;\n\n/* Semantic aliases — light surfaces */\n--surface-page:var(--white);\n--surface-card:var(--white);\n--text-heading:var(--color-primary);\n--text-accent:var(--color-secondary);\n--border-card:var(--border-neutral);\n--border-card-hover:rgba(19,175,240,0.40);\n\n/* Semantic aliases — dark surfaces */\n--surface-dark:var(--navy-600);\n--surface-dark-deep:var(--navy-900);\n--surface-dark-band:var(--navy-700);\n--surface-card-dark:rgba(255,255,255,0.03);\n--surface-card-dark-faint:rgba(255,255,255,0.02);\n--border-dark:rgba(255,255,255,0.08);\n--border-dark-strong:rgba(255,255,255,0.15);\n--text-on-dark:var(--white);\n--text-on-dark-muted:rgba(255,255,255,0.55);\n--text-on-dark-subtle:rgba(255,255,255,0.45);\n--text-on-dark-faint:rgba(255,255,255,0.30);\n\n/* Gradients */\n--gradient-trust:linear-gradient(180deg,#061420 0%,#0D2B3E 100%); /* @kind color */\n--gradient-avatar:linear-gradient(135deg,#153D56,#1C75BC); /* @kind color */\n--glow-cyan:radial-gradient(circle,rgba(19,175,240,0.10) 0%,transparent 65%); /* @kind color */\n--rule-glow:linear-gradient(90deg,transparent,rgba(19,175,240,0.3),transparent); /* @kind color */\n}\n\n:root{\n--font-poppins:'Poppins',system-ui,sans-serif;\n--font-mulish:'Mulish',system-ui,sans-serif;\n--font-heading:var(--font-poppins);\n--font-body:var(--font-mulish);\n\n/* Weights — headings are BLACK (900) by default at Mega */\n--weight-regular:400; /* @kind font */\n--weight-medium:500; /* @kind font */\n--weight-semibold:600; /* @kind font */\n--weight-bold:700; /* @kind font */\n--weight-black:900; /* @kind font */\n\n/* Sizes */\n--text-xs:12px;\n--text-sm:14px;\n--text-base:16px;\n--text-lg:18px;\n--text-xl:20px;\n--text-2xl:24px;\n--text-5xl:48px;\n--display-hero:clamp(3rem,6vw,6rem); /* @kind font */\n--display-section:clamp(2rem,4vw,3.5rem); /* @kind font */\n\n/* Line heights */\n--leading-none:1; /* @kind font */\n--leading-tight:1.15; /* @kind font */\n--leading-normal:1.5; /* @kind font */\n--leading-relaxed:1.625; /* @kind font */\n\n/* Tracking */\n--tracking-tight:-0.02em; /* @kind font */\n--tracking-wide:0.025em; /* @kind font */\n--tracking-label:0.2em; /* @kind font */\n--tracking-eyebrow:0.25em; /* @kind font */\n}\n\n:root{\n--space-1:4px;\n--space-2:8px;\n--space-3:12px;\n--space-4:16px;\n--space-5:20px;\n--space-6:24px;\n--space-7:28px;\n--space-8:32px;\n--space-10:40px;\n--space-12:48px;\n--space-16:64px;\n--space-24:96px;\n--space-32:128px;\n\n/* Radii */\n--radius-sm:4px;\n--radius-xl:12px;\n--radius-2xl:16px;\n--radius-pill:9999px;\n\n/* Layout */\n--container-max:1280px;\n--gutter:24px;\n--gutter-lg:32px;\n--section-y:96px;\n--section-y-lg:128px;\n}\n\n:root{\n--shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1),0 8px 10px -6px rgba(0,0,0,0.1);\n--shadow-2xl:0 25px 50px -12px rgba(0,0,0,0.25);\n--shadow-cyan:0 25px 50px -12px rgba(19,175,240,0.3);\n--transition-base:all 300ms ease; /* @kind other */\n--transition-fast:all 200ms ease; /* @kind other */\n--lift-sm:translateY(-2px); /* @kind other */\n--lift-md:translateY(-4px); /* @kind other */\n--dot-pattern:radial-gradient(circle,rgba(255,255,255,0.9) 1px,transparent 1px); /* @kind other */\n--dot-pattern-size:36px 36px; /* @kind other */\n--dot-pattern-opacity:0.04; /* @kind other */\n}\n*{box-sizing:border-box}\n.no-scrollbar::-webkit-scrollbar{display:none}\n.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}\na{color:var(--color-secondary);text-decoration:none}\na:hover{color:var(--cyan-600)}\n\n<\u002Fstyle>\n  <script src=\"6ff08ca1-6f95-4011-9936-f65a077cf78a\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: #f8f9fa; -webkit-text-size-adjust: 100%; }\n    a { color: #13AFF0; text-decoration: none; }\n    a:hover { color: #0d9fd8; }\n    input, select, textarea, button { font-family: 'Mulish', system-ui, sans-serif; }\n    input:focus, select:focus, textarea:focus { outline: none; border-color: #13AFF0; }\n    input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }\n    input[type=number] { -moz-appearance: textfield; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #f8f9fa; font-family: 'Mulish', system-ui, sans-serif; color: #1a1a1a; padding-bottom: 96px;\">\n\n  <div style=\"background: #060f1e; padding: 20px 20px 22px;\">\n    <div style=\"max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 8px;\">\n        <span style=\"font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: -0.02em; color: #ffffff;\">MEGA<span style=\"color: #13AFF0;\">.<\u002Fspan><\u002Fspan>\n        <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3);\">Service Solutions<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; color: #ffffff; text-align: center\">Storage Management<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 560px; margin: 0 auto; padding: 16px 16px 0;\">\n\n    <sc-if value=\"{{ isEditing }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n\n        <div style "font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #94a3b8;\">Notes<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #334155; white-space: pre-wrap;\">{{ receiptNotes }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-top: 1px solid #e2e8f0; padding-top: 16px;\">\n            <span style=\"font-weight: 500; color: #475569;\">Subtotal<\u002Fspan>\n            <span style=\"font-family: 'Poppins', sans-serif; font-weight: 700; color: #1a1a1a;\">{{ receiptSubtotal }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 14px;\">\n            <span style=\"font-weight: 500; color: #475569;\">Sales tax 7.5%<\u002Fspan>\n            <span style=\"font-family: 'Poppins', sans-serif; font-weight: 700; color: #1a1a1a;\">{{ receiptTax }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\">\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #475569;\">Grand total<\u002Fspan>\n            <span style=\"font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 30px; letter-spacing: -0.02em; line-height: 1; color: #153D56;\">{{ receiptTotal }}<\u002Fspan>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"MegaServiceSolutionsDesignSystem_b24c77.Button\" variant=\"outline\" size=\"md\" sc-camel-on-click=\"{{ backToEdit }}\" dc-props=\"{{ submitStyle }}\" hint-size=\"100%,52px\">Start a new order<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showBar }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position: fixed; left: 0; right: 0; bottom: 0; background: #060f1e; border-top: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n        <span style=\"display: flex; flex-direction: column; gap: 2px;\">\n          <span style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3);\">{{ barLabel }}<\u002Fspan>\n          <span style=\"font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 22px; line-height: 1; letter-spacing: -0.02em; color: #ffffff;\">{{ grandTotal }}<\u002Fspan>\n        <\u002Fspan>\n        <x-import component-from-global-scope=\"MegaServiceSolutionsDesignSystem_b24c77.Button\" size=\"sm\" sc-camel-on-click=\"{{ submit }}\" dc-props=\"{{ barSubmitProps }}\" hint-size=\"auto,40px\">Submit<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sectionsStartOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showLineTotals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\n/* [name, eachPrice (null = ask for price), casePrice, caseLabel, eachNote] */\nconst CATALOG = [\n  { key: \"chem\", name: \"Chemicals\", items: [\n    [\"Spartan HDQ Neutral Germ Cleaner 1GAL\", 25.04, 100.17, \"4 CS\"],\n    [\"Spartan Glass Cleaner 1GAL\", 11.97, 47.91, \"4 CS\"],\n    [\"Spartan COTG #2 HDQC 2LTR\", 17.91, 71.66, \"4 CS\"],\n    [\"Spartan Glass + Surface COTG #3 2LTR\", 34.44, 137.25, \"4 CS\"],\n    [\"Dispenser Spartan Dual\", 0],\n    [\"SparCling\", 4.02, 48.24, \"12 CS\"],\n    [\"SparCreme\", 4.64, 53.73, \"12 CS\"],\n    [\"Aero Shiny Stainless Steel (oil based)\", 7.95, 91.42, \"12 CS\"],\n    [\"Spartan Sure Step\", 23.67, 94.98, \"4 CS\"],\n    [\"Spartan Fast & Easy\", 23.67, 97.98, \"4 CS\"],\n    [\"Spartan SANI-T-10 Sanitizer\", 27.45, 109.95, \"4 CS\"],\n    [\"Spartan Dampmop Neutral Floor Cleaner\", 13.89, 55.56, \"4 CS\"],\n    [\"Tile & Grout Cleaner\", 17.80, 74.02, \"4 CS\"],\n    [\"ECO-GRIP Commercial Floor Cleaner\", 43.31, 132.30, \"4 CS\"],\n    [\"Clean by Peroxy\", 28.00, 111.84, \"4 CS\"],\n    [\"SparSan Q\", 7.95, 88.62, \"12 CS\"],\n    [\"Tree-Z\", 10.49, 125.89, \"12 CS\"],\n    [\"On An On Floor Finish 5GAL\", 119.97, 1104.84, \"PAIL\", \"5 GAL\"],\n    [\"Emulsifier Plus FL Stripper 5GAL\", 103.85, 1040.82, \"PAIL\", \"5 GAL\"],\n    [\"Spartan SC-200 Degreaser 55GAL\", 87.02, 758.04, \"PAIL\", \"5 GAL\"]\n  ]},\n  { key: \"mops\", name: \"Mops and tools\", items: [\n    [\"Dust Mop Cover 24\\\"\", 17.25, 201.24, \"12 CS\"],\n    [\"Dust Mop Frame 24\\\"\", 5.58, 60.48, \"12 CS\"],\n    [\"Dust Mop Cover 36\\\"\", 19.25, 231.00, \"12 CS\"],\n    [\"Dust Mop Frame 36\\\"\", 7.35, 84.60, \"12 CS\"],\n    [\"Dust Mop Handle\", 8.34],\n    [\"Medium Blue WB Looped Blend Mop\", 7.82, 93.80, \"12 CS\"],\n    [\"Medium Red Microfiber Mop Head\", 15.09, 149.85, \"12 CS\"],\n    [\"Medium Blue Microfiber Mop Head\", 15.09, 149.85, \"12 CS\"],\n    [\"Mop Handle 60\\\" Fiberglass Gripper\", 17.51],\n    [\"Mop Bucket\", 72.18],\n    [\"Microfiber Cloth Blue\", 1.08, 12.96, \"12 CS\"],\n    [\"Microfiber Cloth Red\", 1.08, 30.00, \"50 CS\"],\n    [\"Lobby Dust Pan Black\", 19.25, 105.06, \"6 CS\"],\n    [\"Angled Broom Duo-Sweep\", 16.24, 134.68, \"12 CS\"],\n    [\"Vacuum Sanitaire\", 223.86],\n    [\"Vacuum Backpack (bag)\", null],\n    [\"Wolly Duster\", 14.05, 162.00, \"12 CS\"],\n    [\"Spartan Bowl Swab, Acrilon\", 2.00],\n    [\"Grey Trash Can\", null],\n    [\"Caddie Bag\", 50.76],\n    [\"Magic Eraser\", 7.17, 86.04, \"12 CS\"],\n    [\"Pumie Scouring Stick\", 3.20, 19.20, \"6 CS\"],\n    [\"Bottle\", 1.58, 118.98, \"96 CS\"],\n    [\"Trigger Sprayer\", 1.22],\n    [\"Labels\", 0],\n    [\"Janitor Cart Bag\", 18.84],\n    [\"Janitor Cart\", 185.83]\n  ]},\n  { key: \"pads\", name: \"Pads and consumables\", items: [\n    [\"14\\\" Red Spray Pads\", 4.00, 19.36, \"5 CS\"],\n    [\"14\\\" Green Polish Pad\", 4.00, 17.00, \"5 CS\"],\n    [\"16\\\" Black Strip Pad\", 5.32, 26.58, \"5 CS\"],\n    [\"16\\\" Green Scrub Pad\", 4.91, 24.57, \"5 CS\"],\n    [\"16\\\" Red Spray Puff Pad\", 4.85, 24.02, \"5 CS\"],\n    [\"16\\\" White Polish Pad\", 6.48, 32.40, \"5 CS\"],\n    [\"20\\\" Black SuperStrip\", 5.00, 24.60, \"5 CS\"],\n    [\"20\\\" Champagne Pad\", 5.00, 24.94, \"5 CS\"],\n    [\"20\\\" Green Scrub Pad\", 5.79, 28.94, \"5 CS\"],\n    [\"20\\\" Red Buffer Pads\", 6.04, 30.25, \"5 CS\"],\n    [\"20\\\" White Polish Pad\", 7.69, 38.45, \"5 CS\"]\n  ]}\n];\n\nconst money = (n) => \"$\" + n.toFixed(2).replace(/\\B(?=(\\d{3})+(?!\\d))/g, \",\");\nconst today = () => new Date().toISOString().slice(0, 10);\n\nclass Component extends DCLogic {\n  state = {\n    submitter: \"Maria\",\n    submitterOther: \"\",\n    date: today(),\n    account: \"\",\n    subName: \"\",\n    billable: \"Client\",\n    orderType: \"New account\",\n    newSub: \"\", oldSub: \"\", billSub: \"\",\n    qty: {},\n    unit: {},\n    writeIn: \"\",\n    photos: [],\n    notes: \"\",\n    open: {},\n    submitted: false,\n    sending: false,\n    receipt: null,\n    error: \"\"\n  };\n\n  readBase64(file) {\n    return new Promise((resolve, reject) => {\n      const fr = new FileReader();\n      fr.onload = () => {\n        const s = String(fr.result || \"\");\n        resolve(s.slice(s.indexOf(\",\") + 1));\n      };\n      fr.onerror = () => reject(new Error(\"read failed\"));\n      fr.readAsDataURL(file);\n    });\n  }\n\n  blankFields() {\n    return {\n      submitter: \"Maria\",\n      submitterOther: \"\",\n      date: today(),\n      account: \"\",\n      subName: \"\",\n      billable: \"Client\",\n      orderType: \"New account\",\n      newSub: \"\", oldSub: \"\", billSub: \"\",\n      qty: {}, unit: {},\n      writeIn: \"\", photos: [], notes: \"\",\n      sending: false,\n      error: \"\"\n    };\n  }\n\n  componentDidMount() {\n    const startOpen = this.props.sectionsStartOpen ?? true;\n    const open = {};\n    CATALOG.forEach(s => { open[s.key] = startOpen; });\n    this.setState({ open, submitted: false, receipt: null, ...this.blankFields() });\n  }\n\n  bump(id, delta) {\n    this.setState(s => {\n      const next = Math.max(0, (Number(s.qty[id]) || 0) + delta);\n      return { qty: { ...s.qty, [id]: next }, error: \"\" };\n    });\n  }\n\n  isGal(name) {\n    return /GAL|LTR/i.test(name);\n  }\n\n  unitOf(id, it) {\n    const base = this.isGal(it[0]) ? \"GAL\" : \"EA\";\n    if (it[2] == null) return base;\n    return this.state.unit[id] ?? base;\n  }\n\n  unitPrice(it, unit) {\n    return unit === \"CS\" ? (it[2] ?? null) : it[1];\n  }\n\n  lines() {\n    const out = [];\n    CATALOG.forEach(sec => sec.items.forEach((it, i) => {\n      const id = sec.key + \"-\" + i;\n      const q = Number(this.state.qty[id]) || 0;\n      if (q > 0) {\n        const unit = this.unitOf(id, it);\n        out.push({ id, name: it[0], price: this.unitPrice(it, unit), qty: q, unit });\n      }\n    }));\n    return out;\n  }\n\n  renderVals() {\n    const st = this.state;\n    const showLineTotals = this.props.showLineTotals ?? true;\n    const isSubChange = st.orderType === \"Sub change\";\n    const picked = this.lines();\n    const total = picked.reduce((a, l) => a + (l.price || 0) * l.qty, 0);\n    const tbdCount = picked.filter(l => l.price === null).length;\n    const unitCount = picked.reduce((a, l) => a + l.qty, 0);\n\n    const billableOptions = [\"Client\", \"Subcontractor\", \"No\"].map(label => {\n      const on = st.billable === label;\n      return {\n        label,\n        bg: on ? \"#153D56\" : \"#ffffff\",\n        fg: on ? \"#ffffff\" : \"#475569\",\n        bc: on ? \"#153D56\" : \"#e2e8f0\",\n        select: () => this.setState({ billable: label })\n      };\n    });\n\n    const sections = CATALOG.map(sec => {\n      const open = !!st.open[sec.key];\n      const chosen = sec.items.filter((it, i) => (Number(st.qty[sec.key + \"-\" + i]) || 0) > 0).length;\n      return {\n        name: sec.name,\n        open,\n        sign: open ? \"\\u2212\" : \"+\",\n        divider: open ? \"#e2e8f0\" : \"transparent\",\n        meta: chosen > 0 ? chosen + \" of \" + sec.items.length + \" items selected\" : sec.items.length + \" items\",\n        metaColor: chosen > 0 ? \"#13AFF0\" : \"#94a3b8\",\n        toggle: () => this.setState(s => ({ open: { ...s.open, [sec.key]: !s.open[sec.key] } })),\n        items: sec.items.map((it, i) => {\n          const id = sec.key + \"-\" + i;\n          const n = Number(st.qty[id]) || 0;\n          const unit = this.unitOf(id, it);\n          const hasCase = it[2] != null;\n          const active = this.unitPrice(it, unit);\n          const priced = active !== null;\n          let lineTotal = \"\";\n          if (!showLineTotals) lineTotal = \"\";\n          else if (!priced) lineTotal = n > 0 ? \"TBD\" : \"\";\n          else lineTotal = n > 0 ? money(active * n) : \"\";\n          let price;\n          if (it[1] === null) price = \"Ask for price\";\n          else if (it[1] === 0) price = \"Free\";\n          else if (unit === \"CS\") price = money(it[2]) + \" / \" + it[3];\n          else price = money(it[1]) + \" ea\" + (it[4] ? \" (\" + it[4] + \")\" : \"\");\n          return {\n            name: it[0],\n            price,\n            note: unit === \"CS\" ? (it[1] > 0 ? \"(\" + money(it[1]) + \" ea)\" : \"\") : (hasCase ? \"(\" + money(it[2]) + \" / \" + it[3] + \")\" : \"\"),\n            galUnit: hasCase && this.isGal(it[0]),\n            eaUnit: hasCase && !this.isGal(it[0]),\n            fixedUnit: hasCase ? \"\" : (this.isGal(it[0]) ? \"GAL\" : \"EA\"),\n            qtyLabel: String(n),\n            qtyColor: n > 0 ? \"#1a1a1a\" : \"#94a3b8\",\n            decColor: n > 0 ? \"#13AFF0\" : \"#cbd5e1\",\n            unit,\n            lineTotal,\n            totalColor: lineTotal === \"TBD\" ? \"#94a3b8\" : \"#153D56\",\n            rowBg: n > 0 ? \"rgba(19,175,240,0.06)\" : \"#ffffff\",\n            inputBorder: n > 0 ? \"#13AFF0\" : \"#e2e8f0\",\n            dec: () => this.bump(id, -1),\n            inc: () => this.bump(id, 1),\n            onUnit: (e) => this.setState(s => ({ unit: { ...s.unit, [id]: e.target.value } }))\n          };\n        })\n      };\n    });\n\n    let totalNote = \"No items yet. Enter a quantity to add it to the order.\";\n    if (picked.length > 0) {\n      totalNote = unitCount + \" unit\" + (unitCount === 1 ? \"\" : \"s\") + \" across \" + picked.length + \" line\" + (picked.length === 1 ? \"\" : \"s\") + \".\";\n      if (tbdCount > 0) totalNote += \" \" + tbdCount + \" item\" + (tbdCount === 1 ? \"\" : \"s\") + \" priced on request, not in total.\";\n    }\n\n    const rc = st.receipt || {};\n    const submitterName = st.submitter === \"Other\" ? (st.submitterOther.trim() || \"\\u2014\") : st.submitter;\n    const meta = [\n      { label: \"Submitted by\", value: submitterName },\n      { label: \"Account\", value: st.account || \"\\u2014\" },\n      { label: \"Subcontractor\", value: st.subName || \"\\u2014\" },\n      { label: \"Order type\", value: st.orderType },\n      { label: \"Billable\", value: st.billable }\n    ];\n    if (st.photos.length > 0) {\n      meta.push({ label: \"Photos\", value: st.photos.length + \" attached\" });\n    }\n    if (isSubChange) {\n      meta.push({ label: \"New sub\", value: st.newSub || \"\\u2014\" });\n      meta.push({ label: \"Old sub\", value: st.oldSub || \"\\u2014\" });\n      meta.push({ label: \"Bill to sub\", value: st.billSub || \"\\u2014\" });\n    }\n\n    return {\n      isEditing: !st.submitted,\n      submitted: st.submitted,\n      showBar: !st.submitted,\n      isSubChange,\n      submitter: st.submitter,\n      submitterOther: st.submitterOther,\n      isOtherSubmitter: st.submitter === \"Other\",\n      submitterSelectFlex: st.submitter === \"Other\" ? \"0 0 118px\" : \"1 1 auto\",\n      onSubmitter: (e) => this.setState({ submitter: e.target.value }),\n      onSubmitterOther: (e) => this.setState({ submitterOther: e.target.value }),\n      account: st.account,\n      subName: st.subName,\n      orderType: st.orderType,\n      newSub: st.newSub, oldSub: st.oldSub, billSub: st.billSub,\n      writeIn: st.writeIn,\n      notes: st.notes,\n      onNotes: (e) => this.setState({ notes: e.target.value }),\n      receiptNotes: rc.notes || \"\",\n      billableOptions,\n      sections,\n      subtotalLabel: money(total),\n      taxLabel: money(Math.round(total * 0.075 * 100) / 100),\n      grandTotal: money(Math.round(total * 1.075 * 100) / 100),\n      totalNote,\n      barLabel: picked.length > 0 ? \"Total with tax\" : \"No items yet\",\n      error: st.sending ? \"Sending order\\u2026\" : st.error,\n      submitStyle: { style: { width: \"100%\" }, disabled: st.sending },\n      barSubmitProps: { disabled: st.sending },\n      receiptTitle: rc.title || \"\",\n      receiptMeta: rc.meta || [],\n      receiptLines: rc.lines || [],\n      receiptWriteIn: rc.writeIn || \"\",\n      receiptSubtotal: rc.subtotal || money(0),\n      receiptTax: rc.tax || money(0),\n      receiptTotal: rc.total || money(0),\n      hasWriteIn: st.writeIn.trim().length > 0,\n      photos: st.photos.map((p, i) => ({\n        name: p.name,\n        remove: () => this.setState(s => ({ photos: s.photos.filter((x, j) => j !== i) }))\n      })),\n      photoButtonLabel: st.photos.length > 0 ? \"Add another photo\" : \"Attach a photo\",\n      onPhotos: (e) => {\n        const added = Array.from(e.target.files || []).map(f => ({ name: f.name, file: f }));\n        e.target.value = \"\";\n        if (added.length) this.setState(s => ({ photos: [...s.photos, ...added] }));\n      },\n      onAccount: (e) => this.setState({ account: e.target.value, error: \"\" }),\n      onSubName: (e) => this.setState({ subName: e.target.value }),\n      onOrderType: (e) => this.setState({ orderType: e.target.value }),\n      onNewSub: (e) => this.setState({ newSub: e.target.value }),\n      onOldSub: (e) => this.setState({ oldSub: e.target.value }),\n      onBillSub: (e) => this.setState({ billSub: e.target.value }),\n      onWriteIn: (e) => this.setState({ writeIn: e.target.value }),\n      submit: () => {\n        if (st.sending) return;\n        if (!st.account.trim()) return this.setState({ error: \"Add an account name before submitting.\" });\n        if (picked.length === 0 && !st.writeIn.trim()) return this.setState({ error: \"Add at least one item or a write-in.\" });\n\n        const subtotal = total;\n        const tax = Math.round(subtotal * 0.075 * 100) / 100;\n        const grand = Math.round(subtotal * 1.075 * 100) / 100;\n\n        const notesParts = [];\n        if (isSubChange) {\n          notesParts.push(\"New sub: \" + (st.newSub.trim() || \"\\u2014\"));\n          notesParts.push(\"Old sub: \" + (st.oldSub.trim() || \"\\u2014\"));\n          notesParts.push(\"Bill to sub: \" + (st.billSub.trim() || \"\\u2014\"));\n        }\n        if (st.notes.trim()) notesParts.push(\"Notes: \" + st.notes.trim());\n        if (st.photos.length) notesParts.push(\"Photos attached: \" + st.photos.map(p => p.name).join(\", \"));\n\n        const payload = {\n          submitterName: submitterName,\n          billable: st.billable,\n          accountName: st.account.trim(),\n          subcontractorName: st.subName.trim(),\n          orderType: st.orderType,\n          items: picked.map(l => ({\n            name: l.name,\n            qty: l.qty,\n            unit: l.unit,\n            lineTotal: l.price === null ? null : Math.round((l.price || 0) * l.qty * 100) / 100\n          })),\n          specialRequest: st.writeIn.trim(),\n          orderTotal: money(grand),\n          orderNotes: notesParts.join(\" | \"),\n          accountingEmail: \"ar@megasvs.com\"\n        };\n\n        const snapshot = {\n          title: (st.account.trim() || \"This order\") + \" \\u2014 \" + st.orderType.toLowerCase(),\n          meta,\n          lines: picked.map(l => ({\n            label: l.qty + \" \" + l.unit + \" \\u00d7 \" + l.name,\n            total: l.price === null ? \"TBD\" : money((l.price || 0) * l.qty)\n          })),\n          writeIn: st.writeIn.trim(),\n          notes: st.notes.trim(),\n          subtotal: money(subtotal),\n          tax: money(tax),\n          total: money(grand)\n        };\n\n        this.setState({ sending: true, error: \"\" });\n\n        const photo = st.photos[0];\n        const withPhoto = photo && photo.file\n          ? this.readBase64(photo.file).then(b64 => {\n              payload.photoBase64 = b64;\n              payload.photoFilename = photo.name;\n            })\n          : Promise.resolve();\n\n        withPhoto.then(() => fetch(\"https://script.google.com/macros/s/AKfycbz9jaWLv0i79uciHI5ESxSA8qKbuWMxklJwhSg7OaKg4_ilK2qowUJkLUVS7zMdHf-z/exec\", {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n          body: JSON.stringify(payload)\n        })).then(res => {\n          if (!res.ok) throw new Error(\"HTTP \" + res.status);\n          this.setState({ submitted: true, receipt: snapshot, ...this.blankFields() });\n          window.scrollTo(0, 0);\n        }).catch(() => {\n          this.setState({ sending: false, error: \"Could not send the order. Check your connection and tap Submit again \\u2014 your entries are still here.\" });\n        });\n      },\n      backToEdit: () => this.setState({ submitted: false, receipt: null })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
